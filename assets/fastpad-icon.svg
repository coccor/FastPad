<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>FastPad</title>
  <defs>
    <g id="rings">
      <rect x="66" y="30" width="10" height="30" rx="5"/>
      <rect x="90" y="30" width="10" height="30" rx="5"/>
      <rect x="114" y="30" width="10" height="30" rx="5"/>
      <rect x="138" y="30" width="10" height="30" rx="5"/>
      <rect x="162" y="30" width="10" height="30" rx="5"/>
    </g>
  </defs>

  <!-- Flat shadow under the notepad. -->
  <g fill="#181818" transform="translate(0 8)">
    <rect x="48" y="44" width="144" height="172" rx="16"/>
    <use href="#rings"/>
  </g>

  <rect x="48" y="44" width="144" height="172" rx="16" fill="#FFFFFF"/>
  <path d="M64 44h112a16 16 0 0 1 16 16v20H48V60a16 16 0 0 1 16-16z" fill="#FFB020"/>
  <g fill="#181818">
    <circle cx="71" cy="60" r="5"/>
    <circle cx="95" cy="60" r="5"/>
    <circle cx="119" cy="60" r="5"/>
    <circle cx="143" cy="60" r="5"/>
    <circle cx="167" cy="60" r="5"/>
  </g>
  <use href="#rings" fill="#E8EEFB"/>

  <g stroke-width="8" stroke-linecap="round">
    <line x1="70" y1="108" x2="170" y2="108" stroke="#C7D4F5"/>
    <line x1="70" y1="134" x2="170" y2="134" stroke="#C7D4F5"/>
    <line x1="70" y1="160" x2="150" y2="160" stroke="#C7D4F5"/>
    <line x1="70" y1="186" x2="116" y2="186" stroke="#0E2A6E"/>
  </g>
  <rect x="128" y="176" width="7" height="20" rx="2" fill="#FFB020"/>

  <!-- Lightning bolt badge in the corner, outlined in the background color to lift it off the page. -->
  <polygon points="202,132 162,194 188,194 176,240 222,172 196,172"
           fill="#FFE14D" stroke="#181818" stroke-width="12" stroke-linejoin="round"
           paint-order="stroke"/>
</svg>

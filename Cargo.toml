[package]
name = "fastpad"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "=1.0.151"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[test]]
name = "editor_control"
path = "tests/windows/editor_control.rs"

[[test]]
name = "startup_smoke"
path = "tests/windows/startup_smoke.rs"

[[test]]
name = "titlebar"
path = "tests/windows/titlebar.rs"

[[test]]
name = "tabs"
path = "tests/windows/tabs.rs"

[[test]]
name = "open_file"
path = "tests/windows/open_file.rs"

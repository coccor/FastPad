[package]
name = "fastpad"
version = "0.1.1"
edition = "2024"
description = "A startup-latency-first text editor for Windows"
license = "MIT"
repository = "https://github.com/coccor/FastPad"

[dependencies]
serde_json = "=1.0.151"
pulldown-cmark = { version = "=0.13.4", default-features = false }
windows = { version = "=0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }
windows-numerics = { version = "=0.3.1", default-features = false }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Portable-package builds resolve Scintilla.dll only beside FastPad.exe.
release-package = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-size]
inherits = "release"
opt-level = "z"
lto = "thin"

[profile.release-thin]
inherits = "release"
opt-level = 3
lto = "thin"

[[test]]
name = "acceptance"
path = "tests/windows/acceptance.rs"

[[test]]
name = "editor_control"
path = "tests/windows/editor_control.rs"

[[test]]
name = "startup_smoke"
path = "tests/windows/startup_smoke.rs"

[[test]]
name = "titlebar"
path = "tests/windows/titlebar.rs"

[[test]]
name = "tabs"
path = "tests/windows/tabs.rs"

[[test]]
name = "open_file"
path = "tests/windows/open_file.rs"

[[test]]
name = "save_file"
path = "tests/windows/save_file.rs"

[[test]]
name = "editing"
path = "tests/windows/editing.rs"

[[test]]
name = "highlighting"
path = "tests/windows/highlighting.rs"

[[test]]
name = "json_commands"
path = "tests/windows/json_commands.rs"

[[test]]
name = "recovery"
path = "tests/windows/recovery.rs"

[[test]]
name = "single_instance"
path = "tests/windows/single_instance.rs"

[[test]]
name = "markdown_preview"
path = "tests/windows/markdown_preview.rs"
